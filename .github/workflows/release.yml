name: DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app and disk image
        run: |
          ./scripts/build.sh
          ./scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacControl
          path: dist/MacControl.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/MacControl.dmg --clobber
